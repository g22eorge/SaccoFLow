name: Predeploy Verify

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test --max-concurrency 1

      - name: Build
        run: bun run build

      - name: Workflow integrity check
        run: bun run workflow:integrity:check

      - name: Auth preprod check
        run: bun run auth:preprod:check --full

      - name: Smoke check
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_COOKIE: ${{ secrets.SMOKE_COOKIE }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_IDENTIFIER: ${{ secrets.SMOKE_IDENTIFIER }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_OTP_CODE: ${{ secrets.SMOKE_OTP_CODE }}
        run: bun run e2e:smoke
